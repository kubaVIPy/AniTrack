<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AniTrack - Live Anime Tracker</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            brand: {
                                400: "#a78bfa",
                                500: "#8b5cf6",
                                600: "#7c3aed",
                            },
                            darkCard: "#0f172a",
                            darkBorder: "#1e293b",
                            darkBg: "#0b0f19",
                        },
                    },
                },
            };
        </script>
      <script type="module" crossorigin src="./assets/index-CMbnRyF5.js"></script>
      <link rel="stylesheet" crossorigin href="./assets/index-gSxT5WOa.css">
    </head>
    <body class="bg-darkBg text-slate-100 min-h-screen">
        <!-- Loading State Overlay -->
        <div
            id="loadingOverlay"
            class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex flex-col justify-center items-center z-50 hidden"
        >
            <div
                class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-brand-500"
            ></div>
            <p id="loadingText" class="mt-4 text-xs font-bold text-slate-400">
                Loading tracking system...
            </p>
        </div>

        <!-- Login screen view -->
        <div
            id="loginView"
            class="min-h-screen flex items-center justify-center px-4 hidden"
        >
            <div
                class="max-w-md w-full bg-darkCard border border-darkBorder p-8 rounded-3xl shadow-2xl"
            >
                <h1
                    class="text-3xl font-black gradient-text bg-gradient-to-r from-brand-400 to-indigo-400"
                >
                    AniTrack
                </h1>
                <p class="text-xs text-slate-400 mt-1">
                    Track airing schedules across timezones.
                </p>
                <form id="malForm" class="mt-6 space-y-4">
                    <input
                        id="usernameInput"
                        type="text"
                        placeholder="MyAnimeList Username"
                        class="w-full bg-slate-900 border border-darkBorder text-slate-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                        required
                    />
                    <button
                        type="submit"
                        class="w-full bg-brand-500 hover:bg-brand-600 text-white py-3 rounded-xl font-bold transition-all text-sm shadow-lg shadow-brand-500/20"
                    >
                        Sync Watchlist
                    </button>
                </form>
                <div class="relative flex py-4 items-center">
                    <div class="flex-grow border-t border-darkBorder"></div>
                    <span
                        class="flex-shrink mx-4 text-slate-500 text-[10px] uppercase font-bold tracking-wider"
                        >or</span
                    >
                    <div class="flex-grow border-t border-darkBorder"></div>
                </div>
                <button
                    id="demoBtn"
                    class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl font-bold transition-all text-sm"
                >
                    Continue as Guest
                </button>
            </div>
        </div>

        <!-- Main Application Dashboard view -->
        <div id="dashboardView" class="max-w-7xl mx-auto px-4 py-6 hidden">
            <header
                class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-darkBorder pb-6"
            >
                <div class="flex items-center gap-3">
                    <div id="userProfile" class="flex items-center gap-3">
                        <!-- Dynamic Profile Injection -->
                    </div>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <span
                        id="currentTimeZone"
                        class="text-xs text-slate-400 font-semibold"
                    ></span>
                    <button
                        id="logoutBtn"
                        class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl transition-all font-bold ml-auto sm:ml-0"
                    >
                        Logout
                    </button>
                </div>
            </header>

            <!-- Weekly Calendar Area -->
            <section class="mt-8">
                <h2 class="text-lg font-black text-white">
                    Broadcast Schedule
                </h2>
                <div
                    id="calendarDaysGrid"
                    class="grid grid-cols-1 md:grid-cols-7 gap-4 mt-4"
                >
                    <!-- Days will inject here -->
                </div>
            </section>

            <!-- Tracking Watchlist Area -->
            <section class="mt-12">
                <div
                    class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4"
                >
                    <div>
                        <h2 class="text-lg font-black text-white">
                            My Watching List
                        </h2>
                        <p
                            id="totalBehindCount"
                            class="text-xs text-slate-400 font-semibold mt-0.5"
                        >
                            Behind by 0 episodes
                        </p>
                    </div>
                    <div class="flex items-center gap-3 w-full sm:w-auto">
                        <select
                            id="sortSelect"
                            class="bg-darkCard border border-darkBorder text-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none"
                        >
                            <option value="countdown">
                                Sort: Next Episode
                            </option>
                            <option value="score">Sort: Score</option>
                            <option value="title">Sort: Alphabetical</option>
                            <option value="progress">Sort: Most Behind</option>
                        </select>
                        <select
                            id="airingFilter"
                            class="bg-darkCard border border-darkBorder text-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none"
                        >
                            <option value="all">Status: All</option>
                            <option value="airing">Status: Airing</option>
                            <option value="finished">Status: Completed</option>
                        </select>
                    </div>
                </div>

                <!-- Empty Grid Notice -->
                <div
                    id="watchlistEmptyState"
                    class="hidden flex flex-col items-center justify-center py-20 text-center border border-dashed border-darkBorder rounded-3xl mt-6"
                >
                    <h3 class="font-extrabold text-sm text-slate-300">
                        No matches found
                    </h3>
                    <p class="text-xs text-slate-500 max-w-sm mt-1">
                        Try resetting your filters or updates to fetch entries.
                    </p>
                </div>

                <!-- Main Items Grid -->
                <div
                    id="animeGrid"
                    class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-6"
                >
                    <!-- Cards inject here -->
                </div>
                <div
                    id="totalAnimeCount"
                    class="text-center text-slate-500 text-[10px] mt-8 font-bold uppercase tracking-wider"
                ></div>
            </section>
        </div>

        <!-- Information Overlay Details Modal -->
        <div
            id="detailsModal"
            class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex justify-center items-center p-4 z-50 hidden"
        >
            <div
                class="bg-darkCard border border-darkBorder rounded-3xl max-w-2xl w-full p-6 relative max-h-[90vh] overflow-y-auto"
            >
                <button
                    id="closeModalBtn"
                    class="absolute top-4 right-4 text-slate-400 hover:text-white font-bold text-sm"
                >
                    ✕
                </button>
                <div class="flex flex-col md:flex-row gap-6">
                    <img
                        id="modalPoster"
                        class="w-full md:w-48 h-64 object-cover rounded-2xl border border-darkBorder"
                        src=""
                        alt="Poster"
                    />
                    <div class="flex-1">
                        <div
                            id="modalStatusBadge"
                            class="inline-block text-[9px] font-black px-2.5 py-1 rounded-full mb-3"
                        ></div>
                        <h2
                            id="modalTitle"
                            class="text-xl font-extrabold text-white"
                        ></h2>
                        <h4
                            id="modalTitleEnglish"
                            class="text-xs text-slate-400 mt-1"
                        ></h4>
                        <p
                            id="modalSynopsis"
                            class="text-xs text-slate-300 mt-4 leading-relaxed line-clamp-4"
                        ></p>
                        <div
                            class="grid grid-cols-2 gap-4 mt-6 text-xs text-slate-400"
                        >
                            <div>
                                <strong class="text-slate-200">Studio:</strong>
                                <span id="modalStudio"></span>
                            </div>
                            <div>
                                <strong class="text-slate-200"
                                    >Broadcast:</strong
                                >
                                <span id="modalBroadcast"></span>
                            </div>
                            <div>
                                <strong class="text-slate-200"
                                    >Episodes:</strong
                                >
                                <span id="modalEpisodes"></span>
                            </div>
                            <div>
                                <strong class="text-slate-200">Season:</strong>
                                <span id="modalSeason"></span>
                            </div>
                            <div>
                                <strong class="text-slate-200">Score:</strong>
                                ⭐ <span id="modalScore"></span>
                            </div>
                        </div>
                        <div
                            id="modalGenres"
                            class="flex flex-wrap gap-1.5 mt-6"
                        ></div>
                        <div class="mt-6 flex gap-3">
                            <a
                                id="modalTrailerBtn"
                                target="_blank"
                                class="bg-red-600 hover:bg-red-700 text-white text-xs px-4 py-2.5 rounded-xl font-bold"
                                >Watch Trailer</a
                            >
                            <a
                                id="modalMalLink"
                                target="_blank"
                                class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-4 py-2.5 rounded-xl font-bold"
                                >MyAnimeList Page</a
                            >
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
